name: CI/CD Pipeline - IIS Deployment

# ── TRIGGER ────────────────────────────────────────────────────
on:
  push:
    branches:
      - main

# ── VARIABLES ──────────────────────────────────────────────────
env:
  NODE_VERSION: '18'
  IIS_SITE_NAME: 'Portfolio'
  DEPLOY_PATH: 'C:\inetpub\wwwroot\Portfolio-main'

# ── JOBS ───────────────────────────────────────────────────────
jobs:

  # ── JOB 1: BUILD & TEST ──────────────────────────────────────
  build-and-test:
    name: Build and Test
    runs-on: self-hosted

    steps:
      # 1. Checkout code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Install dependencies
      - name: Install Dependencies
        run: npm ci

      # 3. Run tests
      - name: Run Tests
        run: npm test
        continue-on-error: false   # Pipeline stops if tests fail

      # 4. Build the app (for React/Next.js/etc)
      - name: Build Application
        run: npm run build

      # 5. Upload build output as artifact
      #    so the deploy job can use it
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            build/
            public/
            package.json
            package-lock.json
            web.config
          retention-days: 1

  # ── JOB 2: DEPLOY TO IIS ─────────────────────────────────────
  deploy-to-iis:
    name: Deploy to IIS
    runs-on: self-hosted
    needs: build-and-test        # Only runs if build & test passes

    steps:
      # 1. Download the build artifact from Job 1
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: ./deploy-package

      # 2. Stop IIS site before deploying
      #    prevents file-in-use errors
      - name: Stop IIS Site
        run: |
          Import-Module WebAdministration
          Stop-WebSite -Name "${{ env.IIS_SITE_NAME }}"
          Write-Host "IIS site stopped"

      # 3. Clear old files from deployment folder
      - name: Clear Old Deployment
        run: |
          Remove-Item -Path "${{ env.DEPLOY_PATH }}\*" `
                      -Recurse `
                      -Force `
                      -ErrorAction SilentlyContinue
          Write-Host "Old files cleared"

      # 4. Copy new build files to IIS folder
      - name: Deploy New Files
        run: |
          Copy-Item -Path ".\deploy-package\*" `
                    -Destination "${{ env.DEPLOY_PATH }}" `
                    -Recurse `
                    -Force
          Write-Host "New files deployed to ${{ env.DEPLOY_PATH }}"

      # 5. Install production dependencies on server
      - name: Install Production Dependencies
        run: |
          cd "${{ env.DEPLOY_PATH }}"
          npm ci --only=production

      # 6. Start IIS site back up
      - name: Start IIS Site
        run: |
          Import-Module WebAdministration
          Start-WebSite -Name "${{ env.IIS_SITE_NAME }}"
          Write-Host "IIS site started"

      # 7. Verify site is actually running
      - name: Verify Deployment
        run: |
          Import-Module WebAdministration
          $site = Get-WebSite -Name "${{ env.IIS_SITE_NAME }}"
          Write-Host "Site Status: $($site.State)"
          if ($site.State -ne "Started") {
            Write-Host "ERROR: Site failed to start!"
            exit 1
          }
          Write-Host "✅ Deployment successful!"

      # 8. Smoke test — hit the site and check it responds
      - name: Smoke Test
        run: |
          Start-Sleep -Seconds 3
          try {
            $response = Invoke-WebRequest -Uri "http://localhost" -UseBasicParsing
            Write-Host "HTTP Status: $($response.StatusCode)"
            if ($response.StatusCode -eq 200) {
              Write-Host "✅ Site is responding correctly"
            }
          } catch {
            Write-Host "⚠️ Smoke test warning: $($_.Exception.Message)"
          }