name: CI/CD Pipeline - IIS Deployment

on:
  push:
    branches:
      - main

env:
  NODE_VERSION: '22'
  IIS_SITE_NAME: 'Portfolio'
  DEPLOY_PATH: 'C:\inetpub\wwwroot\Portfolio-main'

jobs:

  build:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify Build
        shell: powershell
        run: |
          if (!(Test-Path "dist/index.html")) {
            throw "index.html not found"
          }

          if (!(Test-Path "dist/web.config")) {
            throw "web.config not found"
          }

          Get-ChildItem dist

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vite-dist
          path: dist/

  deploy:
    needs: build
    runs-on: self-hosted

    steps:

      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: vite-dist
          path: dist

      - name: Stop IIS
        shell: powershell
        run: |
          Import-Module WebAdministration
          Stop-WebSite -Name "${{ env.IIS_SITE_NAME }}" -ErrorAction SilentlyContinue

      - name: Clean Deployment Folder
        shell: powershell
        run: |
          if (Test-Path "${{ env.DEPLOY_PATH }}") {
              Remove-Item "${{ env.DEPLOY_PATH }}\*" -Recurse -Force
          }

      - name: Deploy Files
        shell: powershell
        run: |
          Copy-Item "dist\*" "${{ env.DEPLOY_PATH }}" -Recurse -Force

      - name: Verify Deployment Files
        shell: powershell
        run: |
          Get-ChildItem "${{ env.DEPLOY_PATH }}"

          if (!(Test-Path "${{ env.DEPLOY_PATH }}\index.html")) {
            throw "index.html missing"
          }

          if (!(Test-Path "${{ env.DEPLOY_PATH }}\web.config")) {
            throw "web.config missing"
          }

      - name: Start IIS
        shell: powershell
        run: |
          Import-Module WebAdministration
          Start-WebSite -Name "${{ env.IIS_SITE_NAME }}"

      - name: Wait for IIS
        shell: powershell
        run: Start-Sleep 5

      - name: Smoke Test
        shell: powershell
        run: |
          try {
              $response = Invoke-WebRequest `
                  -Uri "http://localhost" `
                  -UseBasicParsing `
                  -ErrorAction Stop

              Write-Host "Status: $($response.StatusCode)"

              if ($response.StatusCode -ne 200) {
                  throw "Unexpected status code"
              }

              Write-Host "Site is working."

          }
          catch {

              Write-Host "Smoke Test Failed"

              Write-Host $_.Exception.Message

              Write-Host ""
              Write-Host "===== Deployed Files ====="

              Get-ChildItem "${{ env.DEPLOY_PATH }}"

              Write-Host ""
              Write-Host "===== web.config ====="

              Get-Content "${{ env.DEPLOY_PATH }}\web.config"

              exit 1
          }