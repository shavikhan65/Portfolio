name: Deploy React to IIS

on:
  push:
    branches:
      - main

jobs:

  deploy:

    runs-on: windows-latest

    steps:

    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Install Packages
      run: npm ci

    - name: Build React
      run: npm run build

    - name: Deploy to IIS
      uses: microsoft/iis-deploy@v1
      with:
        website-name: ${{ secrets.SITE_NAME }}
        server: https://${{ secrets.SERVER }}:8172/msdeploy.axd
        username: ${{ secrets.USERNAME }}
        password: ${{ secrets.PASSWORD }}
        package: ./dist